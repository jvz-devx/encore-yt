# Builds the GPUI app (gpui/) for Linux, Windows and macOS and packages it.
# Build only: no tests, no clippy. A `v*` tag attaches the installers to that
# tag's GitHub Release; a manual run leaves them as workflow artifacts.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
          - name: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
            deno: deno-aarch64-apple-darwin.zip
          - name: macos-x86_64
            os: macos-latest
            target: x86_64-apple-darwin
            deno: deno-x86_64-apple-darwin.zip
    defaults:
      run:
        shell: bash
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5

      - name: Version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$(sed -n 's/^version = "\(.*\)"/\1/p' gpui/Cargo.toml | head -1)-dev.${GITHUB_SHA::7}"
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "Version $version"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: gpui -> target
          key: ${{ matrix.target }}

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config clang libsqlite3-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libxcb1-dev libx11-xcb-dev libwayland-dev libvulkan-dev \
            libfontconfig-dev libfreetype-dev libasound2-dev libssl-dev \
            desktop-file-utils file

      - name: Build
        working-directory: gpui
        run: cargo build --release --locked --target ${{ matrix.target }} -p ytfast-gpui

      # Linux: AppImage, .deb and .rpm, each with yt-dlp and deno.
      - name: Fetch yt-dlp and deno (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p gpui/target/tools
          curl -fsSL -o gpui/target/tools/yt-dlp https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp_linux
          curl -fsSL -o deno.zip https://github.com/denoland/deno/releases/latest/download/deno-x86_64-unknown-linux-gnu.zip
          unzip -o deno.zip -d gpui/target/tools
          chmod +x gpui/target/tools/*
          # cargo-deb and cargo-generate-rpm read target/release.
          mkdir -p gpui/target/release
          cp gpui/target/${{ matrix.target }}/release/ytfast-gpui gpui/target/release/ytfast-gpui

      - name: AppImage
        if: runner.os == 'Linux'
        run: |
          app=AppDir
          mkdir -p $app/usr/bin $app/usr/share/applications $app/usr/share/icons/hicolor/512x512/apps $app/usr/share/doc/ytfast-gpui
          cp gpui/target/release/ytfast-gpui gpui/target/tools/yt-dlp gpui/target/tools/deno $app/usr/bin/
          cp gpui/packaging/linux/AppRun $app/AppRun
          cp gpui/packaging/linux/ytfast-gpui.desktop $app/ytfast-gpui.desktop
          cp gpui/packaging/linux/ytfast-gpui.desktop $app/usr/share/applications/
          cp gpui/packaging/icons/ytfast-gpui.png $app/ytfast-gpui.png
          cp gpui/packaging/icons/ytfast-gpui.png $app/usr/share/icons/hicolor/512x512/apps/
          cp gpui/packaging/THIRD-PARTY.txt $app/usr/share/doc/ytfast-gpui/
          chmod +x $app/AppRun
          desktop-file-validate $app/ytfast-gpui.desktop
          curl -fsSL -o appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          mkdir -p dist
          ARCH=x86_64 APPIMAGE_EXTRACT_AND_RUN=1 ./appimagetool --no-appstream $app "dist/ytfast-gpui-$VERSION-linux-x86_64.AppImage"

      - name: Install cargo-deb and cargo-generate-rpm
        if: runner.os == 'Linux'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deb,cargo-generate-rpm

      - name: .deb and .rpm
        if: runner.os == 'Linux'
        working-directory: gpui
        run: |
          cargo deb --no-build --no-strip -o "../dist/ytfast-gpui-$VERSION-linux-amd64.deb"
          cargo generate-rpm -o "../dist/ytfast-gpui-$VERSION-linux-x86_64.rpm"
          ls -la ../dist

      # Windows: an Inno Setup installer and a portable zip, with mpv, yt-dlp
      # and deno in bin\.
      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: |
          src=dist/windows
          mkdir -p $src/bin
          cp gpui/target/${{ matrix.target }}/release/ytfast-gpui.exe $src/
          cp gpui/packaging/icons/ytfast-gpui.ico gpui/packaging/THIRD-PARTY.txt $src/
          mpv=$(gh release view --repo shinchiro/mpv-winbuild-cmake --json tagName,assets \
            --jq '.tagName as $t | .assets[] | select(.name | test("^mpv-x86_64-[0-9]{8}-git-[0-9a-f]+\\.7z$")) | "\($t) \(.name)"' | head -1)
          read -r mpv_tag mpv_file <<< "$mpv"
          echo "mpv: $mpv_tag $mpv_file"
          gh release download "$mpv_tag" --repo shinchiro/mpv-winbuild-cmake --pattern "$mpv_file" --dir mpv-download
          7z x -ompv-extract "mpv-download/$mpv_file" > /dev/null
          cp mpv-extract/mpv.exe $src/bin/
          cp mpv-extract/*.dll $src/bin/ 2>/dev/null || true
          echo "shinchiro/mpv-winbuild-cmake $mpv_tag $mpv_file" > $src/bin/mpv-version.txt
          curl -fsSL -o $src/bin/yt-dlp.exe https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe
          curl -fsSL -o deno.zip https://github.com/denoland/deno/releases/latest/download/deno-x86_64-pc-windows-msvc.zip
          7z x -o$src/bin deno.zip > /dev/null
          ls -la $src $src/bin
          (cd $src && 7z a -tzip "../ytfast-gpui-$VERSION-windows-x86_64-portable.zip" . > /dev/null)

      - name: Installer (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) {
            $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
            if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
            $env:PATH = "${env:ProgramFiles(x86)}\Inno Setup 6;$env:PATH"
          }
          iscc /Q "/DAppVersion=$env:VERSION" "/DSourceDir=$PWD\dist\windows" "/DOutputDir=$PWD\dist" gpui\packaging\windows\ytfast-gpui.iss
          Remove-Item -Recurse dist\windows
          Get-ChildItem dist

      # macOS: ytfast.app (unsigned, ad-hoc) with yt-dlp and deno, in a .dmg.
      # mpv comes from Homebrew.
      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          app="dmg/ytfast.app"
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources/bin"
          cp gpui/target/${{ matrix.target }}/release/ytfast-gpui "$app/Contents/MacOS/"
          sed "s/@VERSION@/$VERSION/g" gpui/packaging/macos/Info.plist > "$app/Contents/Info.plist"
          cp gpui/packaging/THIRD-PARTY.txt "$app/Contents/Resources/"
          iconset=ytfast-gpui.iconset
          mkdir -p $iconset
          for size in 16 32 128 256 512; do
            sips -z $size $size gpui/packaging/icons/ytfast-gpui.png --out $iconset/icon_${size}x${size}.png > /dev/null
            double=$((size * 2))
            sips -z $double $double gpui/packaging/icons/ytfast-gpui.png --out $iconset/icon_${size}x${size}@2x.png > /dev/null
          done
          iconutil -c icns $iconset -o "$app/Contents/Resources/ytfast-gpui.icns"
          curl -fsSL -o "$app/Contents/Resources/bin/yt-dlp" https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp_macos
          curl -fsSL -o deno.zip "https://github.com/denoland/deno/releases/latest/download/${{ matrix.deno }}"
          unzip -o deno.zip -d "$app/Contents/Resources/bin"
          chmod +x "$app/Contents/Resources/bin/"*
          codesign --force --deep --sign - "$app"
          ln -s /Applications dmg/Applications
          mkdir -p dist
          arch=${{ matrix.name }}
          hdiutil create -volname "ytfast" -srcfolder dmg -ov -format UDZO "dist/ytfast-gpui-$VERSION-${arch}.dmg"
          ls -la dist

      - uses: actions/upload-artifact@v7
        with:
          name: ytfast-gpui-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error
          # The packages are compressed already.
          compression-level: 0

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - run: ls -la dist
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
