# Builds the GPUI app (crates/app) for Linux, Windows and macOS and packages it.
# Build only: no tests, no clippy. A `v*` tag attaches the installers to that
# tag's GitHub Release; a manual run leaves them as workflow artifacts.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # .cargo/config.toml's rustc-wrapper is a shell script for local
  # sccache; Windows can't run it, and CI has no sccache anyway.
  RUSTC_WRAPPER: ""

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
          - name: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
          - name: macos-x86_64
            os: macos-15-intel
            target: x86_64-apple-darwin
    defaults:
      run:
        shell: bash
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5

      - name: Version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$(sed -n 's/^version = "\(.*\)"/\1/p' crates/app/Cargo.toml | head -1)-dev.${GITHUB_SHA::7}"
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "Version $version"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config clang libsqlite3-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libxcb1-dev libx11-xcb-dev libwayland-dev libvulkan-dev \
            libfontconfig-dev libfreetype-dev libasound2-dev libssl-dev \
            cmake desktop-file-utils file

      # ENCORE_VERSION is the version the app reports (`--version`, the
      # update check, M16); the crate's own version has no pre-release part.
      - name: Build
        env:
          ENCORE_VERSION: ${{ env.VERSION }}
        run: cargo build --release --locked --target ${{ matrix.target }} -p encore-yt

      # Linux: AppImage, .deb and .rpm. The app plays and resolves streams
      # itself (Rust audio engine and resolver), so nothing else is bundled.
      - name: Stage the binary (Linux)
        if: runner.os == 'Linux'
        run: |
          # cargo-deb and cargo-generate-rpm read target/release.
          mkdir -p target/release
          cp target/${{ matrix.target }}/release/encore-yt target/release/encore-yt

      - name: AppImage
        if: runner.os == 'Linux'
        run: |
          app=AppDir
          mkdir -p $app/usr/bin $app/usr/share/applications $app/usr/share/icons/hicolor/512x512/apps $app/usr/share/doc/encore-yt
          cp target/release/encore-yt $app/usr/bin/
          cp packaging/linux/AppRun $app/AppRun
          cp packaging/linux/io.github.jvz-devx.encore-yt.desktop $app/io.github.jvz-devx.encore-yt.desktop
          cp packaging/linux/io.github.jvz-devx.encore-yt.desktop $app/usr/share/applications/
          cp packaging/icons/encore-yt.png $app/encore-yt.png
          cp packaging/icons/encore-yt.png $app/usr/share/icons/hicolor/512x512/apps/
          cp packaging/THIRD-PARTY.txt $app/usr/share/doc/encore-yt/
          chmod +x $app/AppRun
          desktop-file-validate $app/io.github.jvz-devx.encore-yt.desktop
          curl -fsSL -o appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          mkdir -p dist
          # zstd (the only compressor appimagetool's mksquashfs has) at level
          # 19 in 1 MB blocks: about 10% smaller than its defaults, and the
          # runtime reads it the same way (docs/gpui/SIZE.md).
          ARCH=x86_64 APPIMAGE_EXTRACT_AND_RUN=1 ./appimagetool --no-appstream \
            --mksquashfs-opt -Xcompression-level --mksquashfs-opt 19 \
            --mksquashfs-opt -b --mksquashfs-opt 1M \
            $app "dist/encore-yt-$VERSION-linux-x86_64.AppImage"

      - name: Install cargo-deb and cargo-generate-rpm
        if: runner.os == 'Linux'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deb,cargo-generate-rpm

      - name: .deb and .rpm
        if: runner.os == 'Linux'
        run: |
          # cargo-deb compresses with xz already. The rpm's payload goes from
          # zstd 19 (the default) to xz 9: 9% smaller (docs/gpui/SIZE.md).
          cargo deb -p encore-yt --no-build --no-strip -o "dist/encore-yt-$VERSION-linux-amd64.deb"
          cargo generate-rpm -p crates/app --payload-compress xz -o "dist/encore-yt-$VERSION-linux-x86_64.rpm"
          ls -la dist

      # Windows: an Inno Setup installer and a portable zip: the executable,
      # its icon and the third-party notices.
      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: |
          src=dist/windows
          mkdir -p $src
          cp target/${{ matrix.target }}/release/encore-yt.exe $src/
          cp packaging/icons/encore-yt.ico packaging/THIRD-PARTY.txt $src/
          ls -la $src
          # -mx=9: deflate with more passes; still a plain zip (docs/gpui/SIZE.md).
          (cd $src && 7z a -tzip -mx=9 "../encore-yt-$VERSION-windows-x86_64-portable.zip" . > /dev/null)

      - name: Installer (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) {
            $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
            if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
            $env:PATH = "${env:ProgramFiles(x86)}\Inno Setup 6;$env:PATH"
          }
          iscc /Q "/DAppVersion=$env:VERSION" "/DSourceDir=$PWD\dist\windows" "/DOutputDir=$PWD\dist" packaging\windows\encore-yt.iss
          Remove-Item -Recurse dist\windows
          Get-ChildItem dist

      # macOS: Encore.app (unsigned, ad-hoc) in a .dmg.
      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          app="dmg/Encore.app"
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
          cp target/${{ matrix.target }}/release/encore-yt "$app/Contents/MacOS/"
          # The macOS the executable was built for (Rust's default target).
          minos=$(otool -l "$app/Contents/MacOS/encore-yt" | awk '/LC_BUILD_VERSION/{b=1} b && $1=="minos"{print $2; exit}')
          minos=${minos:-11.0}
          echo "encore-yt needs macOS $minos"
          sed -e "s/@VERSION@/$VERSION/g" -e "s/@MINOS@/$minos/g" packaging/macos/Info.plist > "$app/Contents/Info.plist"
          cp packaging/THIRD-PARTY.txt "$app/Contents/Resources/"
          iconset=encore-yt.iconset
          mkdir -p $iconset
          for size in 16 32 128 256 512; do
            sips -z $size $size packaging/icons/encore-yt.png --out $iconset/icon_${size}x${size}.png > /dev/null
            double=$((size * 2))
            sips -z $double $double packaging/icons/encore-yt.png --out $iconset/icon_${size}x${size}@2x.png > /dev/null
          done
          iconutil -c icns $iconset -o "$app/Contents/Resources/encore-yt.icns"
          codesign --force --deep --sign - "$app"
          codesign --verify --deep --strict "$app"
          ln -s /Applications dmg/Applications
          mkdir -p dist
          arch=${{ matrix.name }}
          # ULFO (LZFSE) is smaller than UDZO (zlib) and opens on macOS 10.11
          # and later; the cask and Info.plist ask for 11 (docs/gpui/SIZE.md).
          hdiutil create -volname "Encore" -srcfolder dmg -ov -format ULFO "dist/encore-yt-$VERSION-${arch}.dmg"
          ls -la dist

      - uses: actions/upload-artifact@v7
        with:
          name: encore-yt-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error
          # The packages are compressed already.
          compression-level: 0

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      # The app's updater (M16) installs an asset only if its SHA-256 is
      # listed here.
      - name: Checksums
        working-directory: dist
        run: |
          sha256sum -- * > checksums.txt
          cat checksums.txt
      - run: ls -la dist
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true

  # Points the Homebrew cask (Casks/encore-yt.rb, tapped straight from
  # this repository) at the new release and commits that to main. The only
  # job that writes to the repository's branches.
  cask:
    name: Homebrew cask
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - name: Update the cask
        run: |
          gh release download "$TAG" --pattern checksums.txt --dir "$RUNNER_TEMP"
          scripts/update-cask.sh "$TAG" "$RUNNER_TEMP/checksums.txt"
      - name: Commit
        run: |
          if git diff --quiet -- Casks; then
            echo "The cask is already at $TAG"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Cask: ${TAG#v}" -- Casks
          # main may have moved since the checkout.
          git pull --rebase origin main
          git push origin HEAD:main
