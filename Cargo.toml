[package]
name = "ytfast"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
description = "The backend of ytfast-gpui, a native YouTube Music client"
license = "MIT"
authors = ["Tyler Mayberry"]
repository = "https://github.com/MayberryDT/ytfast"
publish = false

# Real-stream check of the Rust audio engine (PLAN M19).
[[example]]
name = "stream_check"
required-features = ["rust-audio"]

[dependencies]
anyhow = "1"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories = "6"
fastrand = "2"
# The backend runtime: InnerTube requests, cover downloads, mpv IPC and yt-dlp.
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "process", "net", "io-util", "fs"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "json", "gzip", "brotli"] }
# MPRIS and desktop notifications over the session bus, served from the
# backend's tokio runtime. The same zbus the app's AccessKit brings in, with
# the same `async-io` reactor: zbus's `tokio` feature would apply to
# AccessKit's zbus too, and accesskit_unix can't run its D-Bus thread with both.
# `blocking-api`: sign-in reads KWallet from a blocking thread (src/auth.rs).
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }
# The tray icon (StatusNotifierItem) while the window is closed; on the same
# zbus and `async-io` reactor, for the same reason.
ksni = { version = "0.3", default-features = false, features = ["async-io"] }
# Reads the browser's cookie store (a copy; the browser keeps it open).
rusqlite = "0.37"
# Chromium's cookie encryption on Linux: PBKDF2-SHA1 key, AES-128-CBC.
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
sha1 = "0.10"
sha2 = "0.10"
rquickjs = "0.14"
# The pure Rust audio engine (docs/gpui/AUDIO.md) in place of mpv, for
# frontends that turn on `rust-audio` (the GPUI app); the egui app keeps mpv.
ytfast-audio = { path = "gpui/crates/audio", optional = true }

# Windows has no system SQLite to link; build it in.
[target.'cfg(windows)'.dependencies]
rusqlite = { version = "0.37", features = ["bundled"] }

[features]
# Playback on ytfast-audio (src/player/rust.rs) as well as mpv; chosen with
# YTFAST_PLAYER=rust|mpv or the player setting.
rust-audio = ["dep:ytfast-audio"]
# Resolve streams in Rust first by default (src/streams.rs), with yt-dlp as
# the fallback; YTFAST_RESOLVER=ytdlp turns it off. Without the feature it
# stays opt-in with YTFAST_RESOLVER=rust.
rust-resolver = []

# Keep dependencies optimized in development (examples and tests); the crate
# itself stays incremental.
[profile.dev.package."*"]
opt-level = 2
