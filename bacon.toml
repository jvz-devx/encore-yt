# Background compiler feedback for the root crate (the backend). For the
# GPUI app, run bacon in gpui/ instead (gpui/bacon.toml). Run it in your own
# terminal, not from an agent task.
#
#   c  check the backend (default)   t  backend tests

default_job = "check"

[jobs.check]
command = ["cargo", "check", "--lib", "--features", "rust-audio"]
need_stdout = false

[jobs.test]
command = ["cargo", "test", "--lib", "--tests", "--features", "rust-audio"]
need_stdout = true

[keybindings]
c = "job:check"
t = "job:test"
