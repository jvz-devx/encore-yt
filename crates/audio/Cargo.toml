[package]
name = "encore-audio"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "The pure Rust playback engine of encore-yt: HTTP range reader, symphonia, libopus, rubato, cpal"
license.workspace = true
publish = false

# No GPUI: the backend (crates/core/src/player/rust.rs) plays through it and the
# visuals crate reads its tap and decoder. See docs/gpui/AUDIO.md.
[dependencies]
# Demux WebM/Matroska (Opus) and MP4 (AAC), decode AAC; Ogg for local
# Opus test files (ENCORE_FAKE_STREAM).
symphonia = { version = "0.6.1", default-features = false, features = ["mkv", "isomp4", "ogg", "aac", "opt-simd"] }
# Opus through libopus, built from source with cmake and linked statically.
symphonia-adapter-libopus = "0.3"
# Audio output: ALSA (PipeWire's ALSA plugin) on Linux, WASAPI, CoreAudio.
cpal = { version = "0.18", features = ["pulseaudio"] }
# Resampling to the device rate (AAC is usually 44.1 kHz, devices 48 kHz).
rubato = "5"
# Lock-free sample queues between the decoder threads and the output callback.
rtrb = "0.3"
# Range requests; the same reqwest and rustls the backend already builds.
reqwest = { workspace = true, features = ["blocking"] }
anyhow.workspace = true
log.workspace = true
