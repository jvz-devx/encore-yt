[package]
name = "encore-cast"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "Encore casting spike (M35): Cast and DLNA discovery, control, and a LAN relay for the stream"
license.workspace = true
repository.workspace = true
publish = false

# A crate of its own so the app can take it behind a feature later, and so
# the spike builds and tests without the app (docs/gpui/CASTING.md).
[lints]
workspace = true

[dependencies]
anyhow.workspace = true
log.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "net", "io-util", "time", "macros", "sync"] }
# The relay forwards a stream URL's bytes (range requests) to the device;
# DLNA control is SOAP over plain HTTP.
reqwest = { workspace = true, features = ["stream"] }
# Cast discovery: `_googlecast._tcp` over mDNS, pure Rust (MIT or Apache-2.0).
mdns-sd = "0.21"
# Cast v2 runs over TLS on port 8009 with the device's self-signed
# certificate. Same rustls as reqwest; the ring provider is chosen
# explicitly because the workspace also builds aws-lc-rs.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
# UPnP device descriptions and SOAP replies.
quick-xml = "0.41"
# Unguessable relay paths.
getrandom = "0.3"
futures-util = { version = "0.3", default-features = false, features = ["std"] }

[dev-dependencies]
# A self-signed certificate for the fake Cast receiver in the tests.
rcgen = { version = "0.14", default-features = false, features = ["ring", "crypto"] }
