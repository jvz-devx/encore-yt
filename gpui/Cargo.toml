[package]
name = "ytfast-gpui"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
description = "A GPUI interface for ytfast's YouTube Music backend"
license = "MIT"
repository = "https://github.com/jvz-devx/ytfast-gpui"
publish = false

[[bin]]
name = "ytfast-gpui"
path = "src/main.rs"

# Its own workspace, separate from the root crate's (whose egui/winit
# patches don't apply here and whose features must not unify with ours).
# crates/visuals holds the wgpu and audio code without GPUI, so it checks
# and tests without building the app.
[workspace]
members = [".", "crates/visuals"]

[dependencies]
# The backend (InnerTube, yt-dlp resolver, mpv, sign-in, MPRIS) without the
# egui interface.
ytfast = { path = "..", default-features = false }
# GPUI with gpui-component, pinned as one set: gpui-kit pins gpui-pre and
# gpui-pre-platform (wayland, x11). Move these together.
gpui-kit = "=0.7.1"
# The HTTP client img("https://...") fetches cover art with; same version as
# the gpui-pre that gpui-kit pins.
reqwest_client = { package = "gpui-pre-reqwest-client", version = "=0.3.8" }
# Wakes the foreground task that drains backend events.
smol = "2"
# SIGTERM/SIGINT/SIGHUP on the backend's runtime (already in the tree).
tokio = { version = "1", features = ["signal"] }
anyhow = "1"
log = "0.4"
# Recently played in the sidebar (already in the tree).
serde_json = "1"
# Same log file and panic log setup as the egui app.
fastframe-log = { git = "https://github.com/crmne/fastframe", tag = "v0.2.2" }
# M8 effects behind Now Playing (wgpu backdrop, PipeWire spectrum, ffmpeg
# waveform), without GPUI; gpui/src/visuals wraps it in views.
ytfast-visuals = { path = "crates/visuals" }
# Builds the BGRA frames GPUI paints (`RenderImage` holds `image::Frame`s).
# Already in the lock through gpui-pre, at the same version.
image = { version = "0.25", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
# Light/dark and reduced motion from the XDG desktop portal's Settings
# (src/theme/portal.rs). Already in the tree through gpui-pre-linux and
# gpui-base with these features, on zbus's `async-io` reactor.
ashpd = { version = "0.13", default-features = false, features = ["async-io", "settings"] }

# Linux packages (cargo-deb, cargo-generate-rpm), built by
# .github/workflows/release.yml after it fetches yt-dlp and deno into
# target/tools. The app lives in /usr/lib/ytfast-gpui with those two in bin/;
# mpv comes from the distribution: both packages depend on it, so apt and
# dnf install it with the app.
[package.metadata.deb]
name = "ytfast-gpui"
maintainer = "jvz-devx <jvz-devx@users.noreply.github.com>"
copyright = "Tyler Mayberry and the ytfast-gpui contributors"
extended-description = "Music: a native YouTube Music client (GPUI interface on ytfast). Bundles yt-dlp and deno; plays through the system's mpv."
section = "sound"
priority = "optional"
depends = "$auto, mpv"
assets = [
    ["target/release/ytfast-gpui", "usr/lib/ytfast-gpui/ytfast-gpui", "755"],
    ["target/tools/yt-dlp", "usr/lib/ytfast-gpui/bin/yt-dlp", "755"],
    ["target/tools/deno", "usr/lib/ytfast-gpui/bin/deno", "755"],
    ["packaging/linux/ytfast-gpui.sh", "usr/bin/ytfast-gpui", "755"],
    ["packaging/linux/ytfast-gpui.desktop", "usr/share/applications/ytfast-gpui.desktop", "644"],
    ["packaging/icons/ytfast-gpui.svg", "usr/share/icons/hicolor/scalable/apps/ytfast-gpui.svg", "644"],
    ["packaging/icons/ytfast-gpui.png", "usr/share/icons/hicolor/512x512/apps/ytfast-gpui.png", "644"],
    ["packaging/THIRD-PARTY.txt", "usr/share/doc/ytfast-gpui/THIRD-PARTY.txt", "644"],
]

[package.metadata.generate-rpm]
name = "ytfast-gpui"
summary = "Music: a native YouTube Music client"
auto-req = "builtin"
assets = [
    { source = "target/release/ytfast-gpui", dest = "/usr/lib/ytfast-gpui/ytfast-gpui", mode = "755" },
    { source = "target/tools/yt-dlp", dest = "/usr/lib/ytfast-gpui/bin/yt-dlp", mode = "755" },
    { source = "target/tools/deno", dest = "/usr/lib/ytfast-gpui/bin/deno", mode = "755" },
    { source = "packaging/linux/ytfast-gpui.sh", dest = "/usr/bin/ytfast-gpui", mode = "755" },
    { source = "packaging/linux/ytfast-gpui.desktop", dest = "/usr/share/applications/ytfast-gpui.desktop", mode = "644" },
    { source = "packaging/icons/ytfast-gpui.svg", dest = "/usr/share/icons/hicolor/scalable/apps/ytfast-gpui.svg", mode = "644" },
    { source = "packaging/icons/ytfast-gpui.png", dest = "/usr/share/icons/hicolor/512x512/apps/ytfast-gpui.png", mode = "644" },
    { source = "packaging/THIRD-PARTY.txt", dest = "/usr/share/doc/ytfast-gpui/THIRD-PARTY.txt", mode = "644", doc = true },
]

[package.metadata.generate-rpm.requires]
mpv = "*"

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
strip = true

# Release speed without release build times, for CPU/GPU measurements and
# visual checks of the effects: `cargo build --profile profiling`. Full
# release (LTO) is for CI and packaging only; after a one-file change it
# re-optimises and re-links the whole app, which takes minutes.
[profile.profiling]
inherits = "release"
lto = false
incremental = true
codegen-units = 16
strip = false
debug = "line-tables-only"
